name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Xcode Tests
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show toolchain
        run: |
          xcodebuild -version
          swift --version

      - name: Run tests
        run: |
          xcodebuild test \
            -project V-Paste.xcodeproj \
            -scheme V-Paste \
            -configuration Debug \
            -destination 'platform=macOS' \
            -derivedDataPath build/DerivedData
